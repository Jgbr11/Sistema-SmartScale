server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: repassa pro container do backend - o navegador fala só com o
    # nginx (mesmo domínio), sem CORS e sem URL fixa no JS compilado.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # fotos e boletins trafegam imagem em base64 dentro do JSON
        client_max_body_size 15m;
    }

    # SPA: qualquer rota que não seja um arquivo de verdade cai no
    # index.html, e o React Router assume dali - sem isso, recarregar
    # a página em /militares (por exemplo) daria 404 no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (JS/CSS do build do Vite) podem cachear
    # forte - o nome muda a cada build, então nunca fica desatualizado.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo de verdade cai no
    # index.html, e o React Router assume dali - sem isso, recarregar
    # a página em /militares (por exemplo) daria 404 no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (JS/CSS do build do Vite) podem cachear
    # forte - o nome muda a cada build, então nunca fica desatualizado.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Perfil de teste: H2 em MEMORIA (nunca toca no ./data/milscale do dev),
# schema recriado do zero a cada execucao da suite.
spring.datasource.url=jdbc:h2:mem:milscale_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

server.port=0

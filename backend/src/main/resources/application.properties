spring.application.name=milscale-backend

# ---------------------------------------------------------------------
# Perfil de desenvolvimento local: H2 em modo de compatibilidade MySQL,
# gravado em arquivo (persiste entre execucoes) em ./data/milscale.
# Nao precisa de Docker nem de um MySQL instalado para rodar.
#
# Para usar o MySQL real (docker-compose), troque para o perfil "mysql":
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (ver application-mysql.properties)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/milscale;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---------------------------------------------------------------------
# Lembrete de servico por email (1 dia de antecedencia). Desabilitado
# por padrao de proposito: sem credenciais de SMTP configuradas via
# variavel de ambiente, o envio de verdade falharia silenciosamente ou
# quebraria a tarefa agendada - com o interruptor desligado, o sistema
# so REGISTRA no log o que teria sido enviado, sem tentar conectar em
# nenhum servidor. Pra ligar de verdade em producao: configure as 4
# variaveis de ambiente abaixo E defina MILSCALE_EMAIL_HABILITADO=true.
# ---------------------------------------------------------------------
milscale.email.habilitado=${MILSCALE_EMAIL_HABILITADO:false}
milscale.lembrete.cron=${MILSCALE_LEMBRETE_CRON:0 0 18 * * *}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sem isso, o Spring tenta conectar no mail server assim que sobe (pra
# testar a conexao) - com host vazio isso derrubaria a aplicacao inteira
# so por causa do email nao configurado. Desabilitado ate ligar de verdade.
management.health.mail.enabled=false

# Origens aceitas pelo CORS (separadas por virgula). Com o front servido
# pelo proprio nginx/proxy do Vite as chamadas sao same-origin e isto nem
# entra em jogo - so importa se o front morar em outro dominio.
milscale.cors.origens=${MILSCALE_CORS_ORIGENS:http://localhost:*}

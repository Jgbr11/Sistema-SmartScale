spring.application.name=milscale-backend

# ---- Banco (desenvolvimento) ----
spring.datasource.url=jdbc:h2:file:./data/milscale;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Schema ----
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Servidor ----
server.port=8080

# ---- Lembrete por email ----
milscale.email.habilitado=${MILSCALE_EMAIL_HABILITADO:false}
milscale.lembrete.cron=${MILSCALE_LEMBRETE_CRON:0 0 18 * * *}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ---- CORS ----
milscale.cors.origens=${MILSCALE_CORS_ORIGENS:http://localhost:*}

# ---- Linha de produto ----
milscale.lps.criterio-ordenacao=${MILSCALE_CRITERIO_ORDENACAO:maior-folga}

# ---- Sessão ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${MILSCALE_COOKIE_SEGURO:false}
server.servlet.session.timeout=8h

# ---- Dados iniciais ----
milscale.seed.demo=${MILSCALE_SEED_DEMO:true}
milscale.admin.cpf=${MILSCALE_ADMIN_CPF:}
milscale.admin.senha=${MILSCALE_ADMIN_SENHA:}

# ---- Fuso horário ----
spring.jackson.time-zone=America/Sao_Paulo

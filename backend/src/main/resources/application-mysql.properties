# ---------------------------------------------------------------------
# Perfil "mysql": aponta para o MySQL real (ex.: container do
# docker-compose). Ativar com --spring.profiles.active=mysql
# (a imagem Docker do backend ja ativa este perfil por padrao).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:milscale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:milscale}
spring.datasource.password=${DB_PASSWORD:milscale}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
